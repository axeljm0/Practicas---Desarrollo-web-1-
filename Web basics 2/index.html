<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Posicionamiento relativo y absoluto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Posicionamiento relativo</h1>

    <div class="contenedor">
        <div id="caja-1">Caja 1</div>
        <div id="caja-2">Caja 2</div>
        <div id="caja-3">Caja 3</div>
        <div id="caja-4">Caja 4</div>

    <h1>Posicionamiento absoluto</h1>

    <div class="contenedor absoluto">
        <div id="caja-a">Caja A</div>
        <div id="caja-b">Caja B</div>
        <div id="caja-c">Caja C</div>
        <div id="caja-d">Caja D</div>
    </div>

</body>
</html>
